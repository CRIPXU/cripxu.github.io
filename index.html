<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cristofer Zerpa - Developer</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1c1330;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 40px;
            border: 2px solid #F6C350;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        h1 { color: #F6C350; font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; }
        .links { display: flex; gap: 20px; }
        a {
            color: #1c1330;
            background-color: #F6C350;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
        }
        a:hover {
            transform: translateY(-3px);
            background-color: #ffd77a;
        }
        .ads-link {
            background-color: transparent;
            color: #F6C350;
            border: 1px solid #F6C350;
        }
        .ads-link:hover {
            background-color: rgba(246, 195, 80, 0.1);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Cristofer Zerpa</h1>
        <p>Android & Flutter Developer</p>
        <div class="links">
            <a href="https://cripxu.github.io/cristofer_zerpa_web_portfolio/">Ver Mi Portfolio</a>
            <a href="app-ads.txt" class="ads-link">Ver app-ads.txt</a>
        </div>
    </div>
</body>
</html>
